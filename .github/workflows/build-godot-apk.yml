name: Build Godot APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "godot/**"
      - ".github/workflows/build-godot-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        run: |
          set -e
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q /tmp/cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Download Godot 4.2.2
        run: |
          set -e
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d $HOME/godot
          GODOT=$(find $HOME/godot -type f -name 'Godot*' | head -1)
          chmod +x "$GODOT"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"
          echo "Godot binary: $GODOT"

      - name: Download Android export templates
        run: |
          set -e
          mkdir -p $HOME/.local/share/godot/export_templates/4.2.2.stable
          curl -fsSL -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          # tpz contains templates/* 
          if [ -d /tmp/templates/templates ]; then
            cp -r /tmp/templates/templates/* $HOME/.local/share/godot/export_templates/4.2.2.stable/
          else
            cp -r /tmp/templates/* $HOME/.local/share/godot/export_templates/4.2.2.stable/
          fi
          ls -la $HOME/.local/share/godot/export_templates/4.2.2.stable/ | head

      - name: Create debug keystore
        run: |
          keytool -genkeypair -v -keystore $HOME/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_DEBUG_KEYSTORE=$HOME/debug.keystore" >> "$GITHUB_ENV"

      - name: Import project (generate .godot)
        working-directory: godot
        run: |
          "$GODOT" --headless --editor --quit-after 3 2>&1 | tail -30 || true

      - name: Export Android Debug APK
        working-directory: godot
        run: |
          set -e
          mkdir -p ../build
          # editor settings for keystore
          mkdir -p $HOME/.config/godot
          cat > $HOME/.config/godot/editor_settings-4.tres << SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/debug_keystore = "${HOME}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
          "$GODOT" --headless --export-debug "Android" "../build/RegionalPower-Godot.apk" 2>&1 | tee /tmp/export.log
          ls -la ../build/ || true
          if [ ! -f ../build/RegionalPower-Godot.apk ]; then
            echo "Export failed, log:"
            cat /tmp/export.log
            exit 1
          fi

      - name: Upload Godot APK
        uses: actions/upload-artifact@v4
        with:
          name: RegionalPower-Godot-apk
          path: build/RegionalPower-Godot.apk
          if-no-files-found: error
