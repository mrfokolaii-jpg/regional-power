name: Build Godot APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        run: |
          set -e
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q /tmp/cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          SM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          chmod +x "$SM"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SM" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SM" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Download Godot + templates
        run: |
          set -e
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d $HOME/godot
          GODOT=$(find $HOME/godot -type f -name 'Godot*' | head -1)
          chmod +x "$GODOT"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"
          mkdir -p $HOME/.local/share/godot/export_templates/4.2.2.stable
          curl -fsSL -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          if [ -d /tmp/templates/templates ]; then
            cp -r /tmp/templates/templates/* $HOME/.local/share/godot/export_templates/4.2.2.stable/
          else
            cp -r /tmp/templates/* $HOME/.local/share/godot/export_templates/4.2.2.stable/
          fi

      - name: Keystore + export_presets
        run: |
          set -e
          keytool -genkeypair -keystore "$HOME/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          KS="$HOME/debug.keystore"
          python3 - << PY
          from pathlib import Path
          import os
          ks = os.path.expanduser("~/debug.keystore")
          # No min_sdk/target_sdk when use_gradle_build=false
          Path("godot/export_presets.cfg").write_text(f"""[preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="../build/RegionalPower-Godot.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/export_format=0
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          keystore/debug="{ks}"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          keystore/release=""
          keystore/release_user=""
          keystore/release_password=""
          version/code=5
          version/name="1.1.3"
          package/unique_name="com.mrfokolaii.regionalpower.godot"
          package/name="Regional Power"
          package/signed=true
          package/app_category=2
          package/retain_data_on_uninstall=false
          package/exclude_from_recents=false
          screen/immersive_mode=true
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true
          user_data_backup/allow=false
          command_line/extra_args=""
          xr_features/xr_mode=0
          gesture/swipe_to_dismiss=false
          permissions/custom_permissions=false
          permissions/internet=false
          """.replace("\n          ", "\n"))
          print(Path("godot/export_presets.cfg").read_text())
          PY
          mkdir -p "$HOME/.config/godot"
          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' \
            '' \
            '[resource]' \
            "export/android/android_sdk_path=\"$HOME/android-sdk\"" \
            "export/android/debug_keystore=\"$KS\"" \
            'export/android/debug_keystore_user="androiddebugkey"' \
            'export/android/debug_keystore_pass="android"' \
            > "$HOME/.config/godot/editor_settings-4.tres"

      - name: Import + Export APK
        working-directory: godot
        run: |
          set -e
          "$GODOT" --headless --path . --import 2>&1 | tail -20 || true
          mkdir -p ../build
          "$GODOT" --headless --path . --export-debug "Android" "../build/RegionalPower-Godot.apk" 2>&1 | tee /tmp/export.log
          if [ ! -f ../build/RegionalPower-Godot.apk ]; then
            echo "EXPORT FAILED"
            cat /tmp/export.log
            exit 1
          fi
          ls -lh ../build/RegionalPower-Godot.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RegionalPower-Godot-apk
          path: build/RegionalPower-Godot.apk
          if-no-files-found: error
