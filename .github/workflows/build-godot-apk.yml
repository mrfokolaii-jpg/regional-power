name: Build Godot APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.2
    steps:
      - uses: actions/checkout@v4

      - name: Setup templates + godot
        run: |
          set -e
          mkdir -p "$HOME/.local/share/godot/export_templates"
          if [ -d /root/.local/share/godot/export_templates ]; then
            cp -a /root/.local/share/godot/export_templates/. "$HOME/.local/share/godot/export_templates/" 2>/dev/null || true
          fi
          ls -la "$HOME/.local/share/godot/export_templates/" || true
          ls -la /root/.local/share/godot/export_templates/ || true
          command -v godot || true
          godot --version || true

      - name: Keystore + export_presets (shell only)
        run: |
          set -e
          KS="$HOME/debug.keystore"
          keytool -genkeypair -keystore "$KS" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          cat > godot/export_presets.cfg << EOF
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="../build/RegionalPower-Godot.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/export_format=0
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          keystore/debug="$KS"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          keystore/release=""
          keystore/release_user=""
          keystore/release_password=""
          version/code=7
          version/name="1.2.1"
          package/unique_name="com.mrfokolaii.regionalpower.godot"
          package/name="Regional Power"
          package/signed=true
          package/app_category=2
          package/retain_data_on_uninstall=false
          package/exclude_from_recents=false
          screen/immersive_mode=true
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true
          user_data_backup/allow=false
          command_line/extra_args=""
          xr_features/xr_mode=0
          gesture/swipe_to_dismiss=false
          permissions/custom_permissions=false
          permissions/internet=false
          EOF
          sed -i 's/^[[:space:]]*//' godot/export_presets.cfg

          mkdir -p "$HOME/.config/godot"
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/lib/android-sdk}}"
          cat > "$HOME/.config/godot/editor_settings-4.tres" << EOSE
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path="$SDK"
          export/android/debug_keystore="$KS"
          export/android/debug_keystore_user="androiddebugkey"
          export/android/debug_keystore_pass="android"
          EOSE
          sed -i 's/^[[:space:]]*//' "$HOME/.config/godot/editor_settings-4.tres"

          echo "=== keystore lines ==="
          grep keystore godot/export_presets.cfg
          echo "SDK=$SDK KS=$KS"
          ls -la "$KS" "$SDK" 2>/dev/null | head || true

      - name: Export APK
        working-directory: godot
        run: |
          set -e
          GODOT_BIN=$(command -v godot || true)
          if [ -z "$GODOT_BIN" ]; then
            GODOT_BIN=$(find /usr /opt /root -name 'Godot*' -type f 2>/dev/null | head -1)
          fi
          echo "Using: $GODOT_BIN"
          "$GODOT_BIN" --version || true
          "$GODOT_BIN" --headless --path . --import 2>&1 | tail -20 || true
          mkdir -p ../build
          "$GODOT_BIN" --headless --path . --export-debug "Android" "../build/RegionalPower-Godot.apk" 2>&1 | tee /tmp/export.log
          if [ ! -f ../build/RegionalPower-Godot.apk ]; then
            echo "=== FULL LOG ==="
            cat /tmp/export.log
            echo "=== TEMPLATES ==="
            find /root /home -path '*export_templates*' 2>/dev/null | head -40
            exit 1
          fi
          ls -lh ../build/RegionalPower-Godot.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RegionalPower-Godot-apk
          path: build/RegionalPower-Godot.apk
          if-no-files-found: error
