name: Build Godot APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        run: |
          set -e
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q /tmp/cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Download Godot 4.2.2
        run: |
          set -e
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d $HOME/godot
          GODOT=$(find $HOME/godot -type f -name 'Godot*' | head -1)
          chmod +x "$GODOT"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"

      - name: Download Android export templates
        run: |
          set -e
          mkdir -p $HOME/.local/share/godot/export_templates/4.2.2.stable
          curl -fsSL -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          if [ -d /tmp/templates/templates ]; then
            cp -r /tmp/templates/templates/* $HOME/.local/share/godot/export_templates/4.2.2.stable/
          else
            cp -r /tmp/templates/* $HOME/.local/share/godot/export_templates/4.2.2.stable/
          fi

      - name: Create debug keystore
        run: |
          keytool -genkeypair -keystore $HOME/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure Godot Android export
        run: |
          set -e
          # Editor settings (no leading spaces)
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" << EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path="$HOME/android-sdk"
          export/android/debug_keystore="$HOME/debug.keystore"
          export/android/debug_keystore_user="androiddebugkey"
          export/android/debug_keystore_pass="android"
          EOF
          # Fix accidental leading spaces from heredoc indent
          sed -i 's/^[[:space:]]*//' "$HOME/.config/godot/editor_settings-4.tres"

          # Patch export_presets with absolute keystore (all three set)
          python3 << 'PY'
          from pathlib import Path
          import os
          home = os.path.expanduser("~")
          p = Path("godot/export_presets.cfg")
          text = p.read_text()
          reps = {
              'keystore/debug=""': f'keystore/debug="{home}/debug.keystore"',
              'keystore/debug_user="androiddebugkey"': 'keystore/debug_user="androiddebugkey"',
              'keystore/debug_password="android"': 'keystore/debug_password="android"',
          }
          # ensure lines exist
          if 'keystore/debug=' not in text:
              text += f'\nkeystore/debug="{home}/debug.keystore"\n'
          text = text.replace('keystore/debug=""', f'keystore/debug="{home}/debug.keystore"')
          if 'keystore/debug_user=' not in text:
              text += '\nkeystore/debug_user="androiddebugkey"\n'
          else:
              import re
              text = re.sub(r'keystore/debug_user=.*', 'keystore/debug_user="androiddebugkey"', text)
          if 'keystore/debug_password=' not in text:
              text += '\nkeystore/debug_password="android"\n'
          else:
              import re
              text = re.sub(r'keystore/debug_password=.*', 'keystore/debug_password="android"', text)
          p.write_text(text)
          print(p.read_text())
          PY

      - name: Import project
        working-directory: godot
        run: |
          "$GODOT" --headless --path . --editor --quit-after 5 2>&1 | tail -40 || true

      - name: Export Android Debug APK
        working-directory: godot
        run: |
          set -e
          mkdir -p ../build
          "$GODOT" --headless --path . --export-debug "Android" "../build/RegionalPower-Godot.apk" 2>&1 | tee /tmp/export.log
          ls -la ../build/ || true
          if [ ! -f ../build/RegionalPower-Godot.apk ]; then
            echo "=== export log ==="
            cat /tmp/export.log
            exit 1
          fi

      - name: Upload Godot APK
        uses: actions/upload-artifact@v4
        with:
          name: RegionalPower-Godot-apk
          path: build/RegionalPower-Godot.apk
          if-no-files-found: error
