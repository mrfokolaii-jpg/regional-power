name: Build Godot APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.2
    steps:
      - uses: actions/checkout@v4

      - name: Setup
        run: |
          set -e
          mkdir -p ~/.local/share/godot/export_templates
          # image already has templates at /root/.local/share/godot/export_templates
          ls /root/.local/share/godot/export_templates/ || true
          ls ~/.local/share/godot/export_templates/ || true
          # link if needed
          if [ -d /root/.local/share/godot/export_templates ] && [ ! -d "$HOME/.local/share/godot/export_templates/4.2.2.stable" ]; then
            mkdir -p "$HOME/.local/share/godot/export_templates"
            ln -sfn /root/.local/share/godot/export_templates/* "$HOME/.local/share/godot/export_templates/" 2>/dev/null || \
              cp -a /root/.local/share/godot/export_templates/. "$HOME/.local/share/godot/export_templates/" || true
          fi
          which godot || which Godot || true
          godot --version || Godot_v4.2.2-stable_linux.x86_64 --version || true

      - name: Keystore + preset
        run: |
          set -e
          keytool -genkeypair -keystore "$HOME/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" || \
          keytool -genkeypair -keystore "$HOME/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          KS="$HOME/debug.keystore"
          python3 - << PY
          from pathlib import Path
          import os
          ks = os.path.expanduser("~/debug.keystore")
          Path("godot/export_presets.cfg").write_text(f"""[preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="../build/RegionalPower-Godot.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/export_format=0
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          keystore/debug="{ks}"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          keystore/release=""
          keystore/release_user=""
          keystore/release_password=""
          version/code=6
          version/name="1.2.0"
          package/unique_name="com.mrfokolaii.regionalpower.godot"
          package/name="Regional Power"
          package/signed=true
          package/app_category=2
          package/retain_data_on_uninstall=false
          package/exclude_from_recents=false
          screen/immersive_mode=true
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true
          user_data_backup/allow=false
          command_line/extra_args=""
          xr_features/xr_mode=0
          gesture/swipe_to_dismiss=false
          permissions/custom_permissions=false
          permissions/internet=false
          """.replace("\n          ", "\n"))
          PY
          mkdir -p "$HOME/.config/godot"
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/lib/android-sdk}}"
          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' \
            '' \
            '[resource]' \
            "export/android/android_sdk_path=\"$SDK\"" \
            "export/android/debug_keystore=\"$KS\"" \
            'export/android/debug_keystore_user="androiddebugkey"' \
            'export/android/debug_keystore_pass="android"' \
            > "$HOME/.config/godot/editor_settings-4.tres"
          echo "SDK=$SDK"
          ls "$SDK" 2>/dev/null | head || true

      - name: Export APK
        working-directory: godot
        run: |
          set -e
          GODOT_BIN=$(command -v godot || command -v Godot || true)
          if [ -z "$GODOT_BIN" ]; then
            GODOT_BIN=$(find /usr /opt /root -name 'Godot*' -type f 2>/dev/null | head -1)
          fi
          echo "Using: $GODOT_BIN"
          "$GODOT_BIN" --version || true
          "$GODOT_BIN" --headless --path . --import 2>&1 | tail -15 || true
          mkdir -p ../build
          "$GODOT_BIN" --headless --path . --export-debug "Android" "../build/RegionalPower-Godot.apk" 2>&1 | tee /tmp/export.log
          if [ ! -f ../build/RegionalPower-Godot.apk ]; then
            echo "=== FULL LOG ==="
            cat /tmp/export.log
            echo "=== TEMPLATES ==="
            find /root /home -path '*export_templates*' 2>/dev/null | head -30
            exit 1
          fi
          ls -lh ../build/RegionalPower-Godot.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RegionalPower-Godot-apk
          path: build/RegionalPower-Godot.apk
          if-no-files-found: error
